[project]
name = "junglesathi-ml"
version = "1.0.0"
description = "JungleSathi Forest Acoustic Threat Detection ML Service"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.9",
    "librosa==0.10.1",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "soundfile==0.12.1",
    "pydantic==2.9.0",
    "pydantic-settings==2.5.0",
    "python-dotenv==1.0.1",
    "aiofiles==24.1.0",
    "audioread==3.0.1",
    "resampy==0.4.3",
    "loguru==0.7.3",
]

[project.optional-dependencies]
onnx = ["onnxruntime==1.17.0"]

[tool.uvicorn]
app = "ml.src.main:app"
